<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SynthGraph — Schema Visualizer</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/cytoscape-fcose/cytoscape-fcose.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root {
  --bg-start: #060b1a;
  --bg-end: #0f1530;
  --card-bg: rgba(20, 25, 55, 0.85);
  --card-border: rgba(100, 120, 200, 0.3);
  --accent-purple: #7c6aff;
  --accent-teal: #00d4aa;
  --accent-coral: #ff6b6b;
  --accent-gold: #ffd700;
  --text-primary: #e8e8f0;
  --text-secondary: #8888aa;
  --text-dim: #555577;
  --glow-purple: rgba(124, 106, 255, 0.4);
  --glow-teal: rgba(0, 212, 170, 0.3);
  --glow-coral: rgba(255, 107, 107, 0.3);
}

html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
body {
  background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
  color: var(--text-primary);
}

/* ─── Animated starfield background ─── */
#starfield {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.star {
  position: absolute; border-radius: 50%;
  background: #fff; animation: twinkle var(--duration) ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.15; transform: scale(0.8); }
  100% { opacity: 0.8; transform: scale(1.2); }
}

/* ─── Cytoscape + overlays container ─── */
#cy-container {
  position: fixed; inset: 0; z-index: 1;
}
#cy {
  width: 100%; height: 100%;
  position: absolute; inset: 0;
}
#overlays {
  position: absolute; inset: 0; z-index: 10;
  pointer-events: none;
}
#overlays > * {
  pointer-events: auto;
}

/* ─── Table Card ─── */
.table-card {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 240px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  overflow: hidden;
  cursor: pointer;
}
.table-card:hover {
  transform: translate(-50%, -50%) scale(1.03);
  box-shadow: 0 12px 48px rgba(0,0,0,0.6), 0 0 24px var(--glow);
  border-color: var(--accent);
  z-index: 100;
}
.table-card.highlight {
  border-color: var(--accent) !important;
  box-shadow: 0 0 32px var(--glow), 0 8px 32px rgba(0,0,0,0.4) !important;
}
.table-card.dim {
  opacity: 0.3;
  filter: grayscale(0.5);
}

.table-header {
  padding: 12px 16px 10px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.table-header .icon {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 5px;
  font-size: 12px;
  flex-shrink: 0;
}

.table-body {
  padding: 4px 0;
}

.col-row {
  display: flex;
  align-items: center;
  padding: 5px 16px;
  font-size: 12px;
  gap: 8px;
  transition: background 0.15s;
  position: relative;
}
.col-row:hover {
  background: rgba(255,255,255,0.04);
}
.col-row .badge {
  width: 16px; height: 16px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  flex-shrink: 0;
  font-weight: 700;
}
.col-row .badge.pk { background: rgba(255,215,0,0.2); color: #ffd700; }
.col-row .badge.fk { background: rgba(167,139,250,0.2); color: #a78bfa; }
.col-row .badge.pkfk { background: linear-gradient(135deg, rgba(255,215,0,0.25), rgba(167,139,250,0.25)); color: #ffd700; }
.col-row .col-name {
  color: var(--text-primary);
  font-weight: 500;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.col-row .col-type {
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 400;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  white-space: nowrap;
}
.col-row .nullable-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--text-dim);
  flex-shrink: 0;
  opacity: 0.5;
}

/* ─── Edge labels (on-canvas) ─── */
.edge-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
  text-shadow: 0 0 8px rgba(0,0,0,0.9);
  pointer-events: none;
  user-select: none;
}

/* ─── Legend ─── */
#legend {
  position: fixed;
  bottom: 24px; left: 24px;
  z-index: 20;
  background: rgba(10, 12, 30, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(100,120,200,0.2);
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 11px;
  min-width: 160px;
}
#legend h3 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 10px;
  font-weight: 600;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
  color: var(--text-secondary);
}
.legend-item:last-child { margin-bottom: 0; }
.legend-line {
  width: 28px; height: 3px;
  border-radius: 2px;
  flex-shrink: 0;
}
.legend-line.dashed { border-top: 2px dashed; height: 0; width: 26px; background: transparent; }
.legend-line.dotted { border-top: 2px dotted; height: 0; width: 26px; background: transparent; }
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 3px;
  flex-shrink: 0;
}

/* ─── Stats ─── */
#stats {
  position: fixed;
  top: 20px; right: 24px;
  z-index: 20;
  display: flex;
  gap: 16px;
  align-items: center;
}
.stat-badge {
  background: rgba(10, 12, 30, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(100,120,200,0.15);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-badge strong {
  color: var(--text-primary);
  font-weight: 600;
}

/* ─── Controls ─── */
#controls {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#controls button {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 1px solid rgba(100,120,200,0.2);
  background: rgba(10, 12, 30, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
#controls button:hover {
  background: rgba(124, 106, 255, 0.2);
  border-color: var(--accent-purple);
  color: var(--text-primary);
}

/* ─── Detail Panel ─── */
#detail {
  position: fixed;
  top: 0; right: -400px;
  width: 360px; height: 100%;
  z-index: 30;
  background: rgba(10, 12, 30, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-left: 1px solid rgba(100,120,200,0.15);
  padding: 28px 24px;
  overflow-y: auto;
  transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: -8px 0 40px rgba(0,0,0,0.5);
}
#detail.open { right: 0; }
#detail .close-btn {
  position: absolute;
  top: 16px; right: 16px;
  background: none; border: none;
  color: var(--text-dim);
  font-size: 20px;
  cursor: pointer;
  transition: color 0.2s;
}
#detail .close-btn:hover { color: var(--text-primary); }
#detail h2 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
}
#detail .table-path { font-size: 11px; color: var(--text-dim); margin-bottom: 20px; }
#detail .section {
  margin-bottom: 20px;
}
#detail .section h3 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 8px;
  font-weight: 600;
}
#detail .col-detail {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  margin-bottom: 4px;
  gap: 10px;
}
#detail .col-detail .col-name { font-weight: 600; flex: 1; }
#detail .col-detail .col-meta { font-size: 11px; color: var(--text-secondary); }
#detail .fk-detail {
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(167,139,250,0.08);
  border: 1px solid rgba(167,139,250,0.15);
  margin-bottom: 6px;
  font-size: 12px;
}
#detail .fk-detail .fk-from { color: var(--text-secondary); }
#detail .fk-detail .fk-arrow { color: var(--text-dim); margin: 0 6px; }

/* ─── Title ─── */
#title {
  position: fixed;
  top: 20px; left: 24px;
  z-index: 20;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
}
#title .logo {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent-purple), var(--accent-teal));
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
}
#title .sub {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 400;
  letter-spacing: 0;
}

/* ─── Tooltip ─── */
#tooltip {
  position: fixed;
  z-index: 50;
  pointer-events: none;
  background: rgba(10, 12, 30, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(100,120,200,0.2);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--text-secondary);
  opacity: 0;
  transition: opacity 0.15s;
  max-width: 280px;
}
#tooltip.visible {
  opacity: 1;
}

/* ─── Scrollbar ─── */
#detail::-webkit-scrollbar { width: 4px; }
#detail::-webkit-scrollbar-track { background: transparent; }
#detail::-webkit-scrollbar-thumb { background: rgba(100,120,200,0.3); border-radius: 2px; }
</style>
</head>
<body>

<!-- Starfield -->
<div id="starfield"></div>

<!-- Title -->
<div id="title">
  <div class="logo">◈</div>
  SynthGraph
  <span class="sub">Schema Visualizer</span>
</div>

<!-- Stats -->
<div id="stats"></div>

<!-- Main container -->
<div id="cy-container">
  <div id="cy"></div>
  <div id="overlays"></div>
</div>

<!-- Legend -->
<div id="legend">
  <h3>Legend</h3>
  <div class="legend-item"><div class="legend-line" style="background:var(--accent-purple)"></div> Foreign Key</div>
  <div class="legend-item"><div class="legend-line" style="background:var(--accent-gold);width:20px"></div> One-to-One</div>
  <div class="legend-item"><div class="legend-line" style="background:var(--accent-teal)"></div> Enum Usage</div>
  <div class="legend-item">
    <div class="legend-line dashed" style="border-color:var(--text-dim)"></div>
    Contains
  </div>
  <div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06)">
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-gold)"></div> Primary Key</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-purple)"></div> Foreign Key</div>
  </div>
</div>

<!-- Controls -->
<div id="controls">
  <button onclick="fitGraph()" title="Fit to View">⊞</button>
  <button onclick="resetLayout()" title="Re-layout">⟳</button>
</div>

<!-- Detail Panel -->
<div id="detail">
  <button class="close-btn" onclick="closeDetail()">✕</button>
  <div id="detail-content"></div>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<script>
// ─── Starfield generation ───
(function createStars() {
  const container = document.getElementById('starfield');
  const count = 120;
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = 1 + Math.random() * 2;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
    star.style.animationDelay = Math.random() * 4 + 's';
    container.appendChild(star);
  }
})();

// ─── Graph data ───
let graphData = null;
let cy = null;
let nodeCards = new Map();
let tableColumns = new Map();
let tableFKs = new Map();
let edgeLabels = [];

// Fetch and render
(async function init() {
  try {
    const res = await fetch('/api/graph');
    graphData = await res.json();
    renderGraph();
  } catch (err) {
    document.getElementById('cy').innerHTML = `
      <div style="color:#ff6b6b;padding:40px;text-align:center">
        <h2>Failed to load graph</h2>
        <p style="color:#8888aa;margin-top:8px;font-size:13px">${err.message}</p>
      </div>`;
  }
})();

function renderGraph() {
  // ─── Process data ───
  const nodes = graphData.node_list || [];
  const edges = graphData.edges || [];

  // Index nodes by ID
  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.id] = n; });

  // Build table → columns and table → FK maps
  edges.forEach(e => {
    if (e.kind === 'contains') {
      const tableId = e.from;
      const colNode = nodeMap[e.to];
      if (!tableColumns.has(tableId)) tableColumns.set(tableId, []);
      if (colNode) tableColumns.get(tableId).push(colNode);
    }
  });

  edges.forEach(e => {
    if (e.kind === 'references') {
      if (!tableFKs.has(e.from)) tableFKs.set(e.from, []);
      tableFKs.get(e.from).push(e);
    }
  });

  // ─── Build Cytoscape elements ───
  const cyElements = [];
  const tableNodesForCy = [];
  const enumNodesForCy = [];

  nodes.forEach(node => {
    if (node.kind === 'table') {
      const cols = tableColumns.get(node.id) || [];
      // Assign accent based on FK role
      const outgoingFKs = tableFKs.get(node.id) || [];
      const incomingFKs = edges.filter(e => e.kind === 'references' && e.to === node.id);
      let accent = 'purple';
      if (outgoingFKs.length === 0 && incomingFKs.length === 0) accent = 'teal';
      else if (outgoingFKs.length + incomingFKs.length >= 3) accent = 'coral';
      else if (outgoingFKs.length > 0 && incomingFKs.length === 0) accent = 'teal';

      const colCount = cols.length;
      const height = Math.max(80, 52 + colCount * 28);

      cyElements.push({
        data: {
          id: node.id,
          label: node.label,
          kind: 'table',
          accent,
          cols: cols.map(c => ({
            id: c.id,
            label: c.label,
            type: c.data?.type || '',
            isPK: c.data?.is_primary_key || false,
            nullable: c.data?.nullable || false,
            default: c.data?.default || null,
            length: c.data?.length || 0,
          })),
          fks: outgoingFKs.map(e => {
            const meta = e.metadata || {};
            return {
              to: e.to,
              localCols: meta.local_columns || [],
              foreignCols: meta.foreign_columns || [],
              cardinality: meta.cardinality || 'one_to_many',
            };
          }),
          referencedBy: incomingFKs.map(e => {
            const meta = e.metadata || {};
            return {
              from: e.from,
              localCols: meta.local_columns || [],
              foreignCols: meta.foreign_columns || [],
            };
          }),
        },
        classes: [`accent-${accent}`],
      });
      tableNodesForCy.push(node.id);
    } else if (node.kind === 'enum') {
      cyElements.push({
        data: { id: node.id, label: node.label, kind: 'enum', values: node.data?.values || [] },
      });
      enumNodesForCy.push(node.id);
    }
  });

  edges.forEach(e => {
    if (e.kind === 'references') {
      const meta = e.metadata || {};
      const cardinality = meta.cardinality || 'one_to_many';
      const fromNode = nodeMap[e.from];
      const toNode = nodeMap[e.to];
      const label = cardinality === 'one_to_one' ? '1—1'
        : cardinality === 'many_to_many' ? '*—*'
        : '1—*';
      cyElements.push({
        data: {
          id: `ref:${e.from}:${e.to}`,
          source: e.from,
          target: e.to,
          kind: 'references',
          cardinality,
          label,
          localCols: (meta.local_columns || []).join(', '),
          foreignCols: (meta.foreign_columns || []).join(', '),
        },
      });
    } else if (e.kind === 'uses_enum') {
      cyElements.push({
        data: {
          id: `enum:${e.from}:${e.to}`,
          source: e.from,
          target: e.to,
          kind: 'uses_enum',
        },
      });
    }
  });

  // ─── Initialize Cytoscape ───
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: cyElements,
    style: [
      // Table nodes (invisible — rendered as HTML)
      {
        selector: 'node[kind = "table"]',
        style: {
          'opacity': 0,
          'width': 240,
          'height': 120,
          'events': 'no',
        },
      },
      // Enum nodes
      {
        selector: 'node[kind = "enum"]',
        style: {
          'shape': 'diamond',
          'background-color': 'rgba(0, 212, 170, 0.15)',
          'border-color': 'var(--accent-teal, #00d4aa)',
          'border-width': 2,
          'color': '#00d4aa',
          'font-size': '12px',
          'font-weight': '600',
          'text-valign': 'center',
          'text-halign': 'center',
          'width': 60,
          'height': 60,
          'label': 'data(label)',
          'border-style': 'solid',
          'transition-property': 'border-color, background-color',
          'transition-duration': '0.2s',
        },
      },
      // References edges
      {
        selector: 'edge[kind = "references"]',
        style: {
          'curve-style': 'unbundled-bezier',
          'control-point-distances': [40, -40],
          'control-point-weights': [0.25, 0.75],
          'width': 2.5,
          'line-color': 'var(--accent-purple, #7c6aff)',
          'target-arrow-color': 'var(--accent-purple, #7c6aff)',
          'target-arrow-shape': 'triangle',
          'arrow-scale': 1.2,
          'opacity': 0.7,
          'line-style': 'solid',
          'z-index': 5,
          'transition-property': 'opacity, line-color',
          'transition-duration': '0.2s',
        },
      },
      // Cardinality-specific edge styles
      {
        selector: 'edge[cardinality = "one_to_one"]',
        style: {
          'line-color': 'rgba(255, 215, 0, 0.7)',
          'target-arrow-color': 'rgba(255, 215, 0, 0.7)',
          'width': 3,
        },
      },
      {
        selector: 'edge[cardinality = "many_to_many"]',
        style: {
          'line-color': 'rgba(255, 107, 107, 0.7)',
          'target-arrow-color': 'rgba(255, 107, 107, 0.7)',
          'width': 3,
          'line-style': 'dashed',
        },
      },
      // Uses enum edges
      {
        selector: 'edge[kind = "uses_enum"]',
        style: {
          'curve-style': 'bezier',
          'width': 1.5,
          'line-color': 'rgba(0, 212, 170, 0.4)',
          'target-arrow-color': 'rgba(0, 212, 170, 0.4)',
          'target-arrow-shape': 'triangle',
          'arrow-scale': 0.8,
          'opacity': 0.5,
          'line-style': 'dotted',
        },
      },
      // Edge labels
      {
        selector: 'edge[kind = "references"]:parent',
        style: {
          'label': 'data(label)',
          'font-size': '9px',
          'color': '#8888aa',
          'text-background-color': 'rgba(10, 12, 30, 0.7)',
          'text-background-opacity': 1,
          'text-background-padding': '3px',
          'text-border-radius': '4px',
          'text-valign': 'top',
          'text-halign': 'center',
          'text-margin-y': -6,
          'z-index': 10,
        },
      },
      // Hover state
      {
        selector: 'edge:hover',
        style: {
          'opacity': 1,
          'width': 3.5,
          'transition-duration': '0.15s',
        },
      },
    ],
    layout: {
      name: 'fcose',
      quality: 'proof',
      idealEdgeLength: node => {
        if (node.data('kind') === 'uses_enum') return 80;
        return 220;
      },
      nodeRepulsion: 8000,
      gravity: 1.5,
      numIter: 2500,
      tile: true,
      randomize: false,
      animate: true,
      animationDuration: 800,
      animationEasing: 'ease-out',
      fit: true,
      padding: 60,
      nestingFactor: 0,
    },
    minZoom: 0.1,
    maxZoom: 3,
    wheelSensitivity: 0.3,
  });

  // ─── Create HTML card overlays ───
  cy.on('ready layoutstop', () => {
    createCards();
    updateCards();
    updateStats();
  });

  cy.on('pan zoom resize', updateCards);
  cy.on('viewport', updateCards);

  // ─── Hover interactions ───
  let hoveredNodeId = null;
  let lastHovered = null;

  cy.on('mouseover', 'node[kind = "table"]', (evt) => {
    const nodeId = evt.target.id();
    highlightNeighborhood(nodeId);
  });

  cy.on('mouseout', 'node[kind = "table"]', (evt) => {
    clearHighlight();
  });

  // Click to open detail panel
  cy.on('tap', 'node[kind = "table"]', (evt) => {
    openDetail(evt.target.id());
  });

  // Click on background to close detail
  cy.on('tap', function(evt) {
    if (evt.target === cy) closeDetail();
  });

  // ─── Edge tooltip ───
  const tooltip = document.getElementById('tooltip');
  cy.on('mouseover', 'edge[kind = "references"]', (evt) => {
    const edge = evt.target;
    const src = nodeMap[edge.data('source')]?.label || edge.data('source');
    const tgt = nodeMap[edge.data('target')]?.label || edge.data('target');
    const cols = edge.data('localCols');
    tooltip.innerHTML = `
      <strong style="color:#e8e8f0">${src}</strong>
      <span style="color:#666"> → </span>
      <strong style="color:#e8e8f0">${tgt}</strong>
      ${cols ? `<br><span style="color:#8888aa">on ${cols}</span>` : ''}
    `;
    tooltip.className = 'visible';
    moveTooltip(evt);
  });
  cy.on('mousemove', 'edge[kind = "references"]', moveTooltip);
  cy.on('mouseout', 'edge', () => { tooltip.className = ''; });

  function moveTooltip(evt) {
    const rect = cy.container().getBoundingClientRect();
    tooltip.style.left = (evt.renderedPosition?.x || evt.clientX - rect.left + 15) + 'px';
    tooltip.style.top = (evt.renderedPosition?.y || evt.clientY - rect.top - 10) + 'px';
  }
}

// ─── Card management ───
function createCards() {
  const container = document.getElementById('overlays');
  container.innerHTML = '';

  cy.nodes('[kind = "table"]').forEach(node => {
    const card = document.createElement('div');
    card.className = 'table-card';
    card.id = `card-${node.id()}`;

    const data = node.data();
    const accentVar = data.accent === 'coral' ? '--accent-coral'
      : data.accent === 'teal' ? '--accent-teal'
      : '--accent-purple';
    card.style.setProperty('--accent', `var(${accentVar})`);
    card.style.setProperty('--glow', `var(--glow-${data.accent === 'coral' ? 'coral' : data.accent === 'teal' ? 'teal' : 'purple'})`);
    card.style.borderTop = `2px solid var(${accentVar})`;

    const iconMap = { purple: '⬡', teal: '◆', coral: '⬢' };

    let html = `<div class="table-header">
      <div class="icon" style="background:var(${accentVar})">${iconMap[data.accent] || '⬡'}</div>
      ${node.data('label')}
    </div><div class="table-body">`;

    (data.cols || []).forEach(col => {
      const isPK = col.isPK;
      const isFK = (data.fks || []).some(fk => fk.localCols.includes(col.label));
      const badgeClass = isPK && isFK ? 'pkfk' : isPK ? 'pk' : isFK ? 'fk' : '';
      const badgeText = isPK && isFK ? '⚋' : isPK ? '🔑' : isFK ? '🔗' : '';
      const nullableDot = col.nullable ? '<span class="nullable-dot"></span>' : '';
      html += `<div class="col-row">
        <div class="badge ${badgeClass || ''}">${badgeText || ''}</div>
        <span class="col-name">${col.label}</span>
        <span class="col-type">${col.type}${col.length ? '('+col.length+')' : ''}</span>
        ${nullableDot}
      </div>`;
    });

    html += '</div>';
    card.innerHTML = html;

    card.addEventListener('mouseenter', () => {
      highlightNeighborhood(node.id());
    });
    card.addEventListener('mouseleave', clearHighlight);
    card.addEventListener('click', () => openDetail(node.id()));

    container.appendChild(card);
    nodeCards.set(node.id(), card);
  });
}

function updateCards() {
  const zoom = cy.zoom();
  const pan = cy.pan();
  nodeCards.forEach((card, nodeId) => {
    const node = cy.getElementById(nodeId);
    if (!node || !node.visible()) { card.style.display = 'none'; return; }
    card.style.display = '';
    const pos = node.position();
    const canvasPos = cy.container().getBoundingClientRect();
    const x = (pos.x * zoom + pan.x);
    const y = (pos.y * zoom + pan.y);
    // Position relative to the container (already positioned at 0,0)
    card.style.left = x + 'px';
    card.style.top = y + 'px';
    card.style.transform = `translate(-50%, -50%) scale(${Math.min(1, Math.max(0.6, zoom / 1.2))})`;
    card.style.opacity = Math.min(1, zoom / 0.4);
  });

  // Hide detail on zoom extremes
  const detail = document.getElementById('detail');
  if (zoom < 0.3 && detail.classList.contains('open')) {
    // keep it open but hint
  }
}

// ─── Neighborhood highlighting ───
function highlightNeighborhood(nodeId) {
  const node = cy.getElementById(nodeId);
  if (!node || !node.isNode()) return;

  // Collect connected nodes via any relationship
  const connected = new Set();
  connected.add(nodeId);

  node.connectedEdges().forEach(edge => {
    connected.add(edge.source().id());
    connected.add(edge.target().id());
  });

  cy.nodes('[kind = "table"]').forEach(n => {
    const card = nodeCards.get(n.id());
    if (!card) return;
    if (connected.has(n.id())) {
      card.classList.remove('dim');
      card.classList.add('highlight');
    } else {
      card.classList.add('dim');
      card.classList.remove('highlight');
    }
  });

  cy.edges().forEach(e => {
    if (connected.has(e.source().id()) && connected.has(e.target().id())) {
      e.style({ 'opacity': 1, 'z-index': 10 });
    } else {
      e.style({ 'opacity': 0.15, 'z-index': 0 });
    }
  });
}

function clearHighlight() {
  nodeCards.forEach(card => {
    card.classList.remove('dim', 'highlight');
  });
  cy.edges().forEach(e => {
    e.style({ 'opacity': null, 'z-index': null });
  });
}

// ─── Detail panel ───
function openDetail(nodeId) {
  const node = cy.getElementById(nodeId);
  if (!node) return;
  const data = node.data();
  const content = document.getElementById('detail-content');

  const cols = data.cols || [];
  const fks = data.fks || [];
  const refs = data.referencedBy || [];
  const isEnum = data.kind === 'enum';

  let html = '';

  if (data.kind === 'table') {
    html += `<h2>
      <span style="color:var(--accent-${data.accent})">${'⬡'}</span>
      ${data.label}
    </h2>
    <div class="table-path">${nodeId}</div>`;

    // Columns section
    html += `<div class="section"><h3>Columns (${cols.length})</h3>`;
    cols.forEach(col => {
      const isPK = col.isPK;
      const isFK = fks.some(fk => fk.localCols.includes(col.label));
      const badge = isPK && isFK ? '🔑🔗' : isPK ? '🔑' : isFK ? '🔗' : '';
      html += `<div class="col-detail">
        <span class="col-name">${badge ? `<span style="margin-right:6px">${badge}</span>` : ''}${col.label}</span>
        <span class="col-meta">${col.type}${col.length ? '('+col.length+')' : ''}${col.nullable ? ' NULL' : ' NOT NULL'}${col.default !== null && col.default !== undefined ? ' DEFAULT ' + col.default : ''}</span>
      </div>`;
    });
    html += `</div>`;

    // FK section
    if (fks.length > 0) {
      html += `<div class="section"><h3>Foreign Keys (${fks.length})</h3>`;
      const nodeMap = {};
      graphData.node_list.forEach(n => { nodeMap[n.id] = n; });
      fks.forEach(fk => {
        const targetNode = nodeMap[fk.to];
        const targetName = targetNode ? targetNode.label : fk.to;
        const cardLabel = fk.cardinality === 'one_to_one' ? '1—1' : fk.cardinality === 'many_to_many' ? '*—*' : '1—*';
        html += `<div class="fk-detail">
          <span class="fk-from">(${fk.localCols.join(', ')})</span>
          <span class="fk-arrow">→</span>
          <strong>${targetName}</strong>
          <span style="color:#8888aa;font-size:10px;margin-left:6px">(${fk.foreignCols.join(', ')})</span>
          <span style="float:right;color:var(--text-dim);font-size:10px">${cardLabel}</span>
        </div>`;
      });
      html += `</div>`;
    }

    // Referenced by section
    if (refs.length > 0) {
      html += `<div class="section"><h3>Referenced By (${refs.length})</h3>`;
      const nodeMap = {};
      graphData.node_list.forEach(n => { nodeMap[n.id] = n; });
      refs.forEach(ref => {
        const srcNode = nodeMap[ref.from];
        const srcName = srcNode ? srcNode.label : ref.from;
        html += `<div class="fk-detail" style="background:rgba(0,212,170,0.06);border-color:rgba(0,212,170,0.1)">
          <strong>${srcName}</strong>
          <span class="fk-arrow">→</span>
          <span class="fk-from">(${ref.localCols.join(', ')})</span>
        </div>`;
      });
      html += `</div>`;
    }
  } else if (isEnum) {
    html += `<h2>
      <span style="color:var(--accent-teal)">◆</span>
      ${data.label}
    </h2>
    <div class="table-path">${nodeId}</div>
    <div class="section"><h3>Values (${(data.values || []).length})</h3>`;
    (data.values || []).forEach(v => {
      html += `<div class="col-detail"><span class="col-name">${v}</span></div>`;
    });
    html += `</div>`;
  }

  content.innerHTML = html;
  document.getElementById('detail').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

// ─── Stats ───
function updateStats() {
  const stats = document.getElementById('stats');
  const nodes = graphData.node_list || [];
  const edges = graphData.edges || [];
  const tables = nodes.filter(n => n.kind === 'table');
  const enums = nodes.filter(n => n.kind === 'enum');
  const refs = edges.filter(e => e.kind === 'references');
  const enumEdges = edges.filter(e => e.kind === 'uses_enum');

  stats.innerHTML = `
    <div class="stat-badge">Tables <strong>${tables.length}</strong></div>
    <div class="stat-badge">Foreign Keys <strong>${refs.length}</strong></div>
    <div class="stat-badge">Enums <strong>${enums.length}</strong></div>
    <div class="stat-badge">Columns <strong>${nodes.filter(n => n.kind === 'column').length}</strong></div>
  `;
}

// ─── Controls ───
function fitGraph() {
  if (cy) {
    cy.fit(undefined, 60);
    updateCards();
  }
}

function resetLayout() {
  if (!cy) return;
  nodeCards.forEach(card => card.remove());
  nodeCards.clear();
  cy.layout({
    name: 'fcose',
    quality: 'proof',
    idealEdgeLength: node => node.data('kind') === 'uses_enum' ? 80 : 220,
    nodeRepulsion: 8000,
    gravity: 1.5,
    numIter: 2500,
    tile: true,
    animate: true,
    animationDuration: 800,
    animationEasing: 'ease-out',
    fit: true,
    padding: 60,
  }).run();
  cy.once('layoutstop', () => {
    createCards();
    updateCards();
  });
}

// Handle resize
window.addEventListener('resize', () => {
  if (cy) setTimeout(updateCards, 100);
});
</script>
