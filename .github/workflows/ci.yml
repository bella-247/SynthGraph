name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"
  GOFLAGS: "-count=1"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test ./... -race -timeout=180s

      - name: Build CLI (sanity check)
        run: go build -o ${{ runner.temp }}/synthgraph ./cmd/synthgraph

      - name: Build web app (sanity check)
        run: go build -o ${{ runner.temp }}/synthgraph-web ./cmd/synthgraph-web

      - name: Test server package (no CGO)
        run: go test ./cmd/synthgraph-web/server/ -v -count=1

      - name: Build serveviz (sanity check)
        run: go build -o /dev/null ./cmd/serveviz
