name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CGO_ENABLED: "1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev
      - run: go test ./... -race -count=1 -timeout=180s

  build-linux-cli:
    name: Build CLI (Linux)
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install C cross-compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Install C compiler (amd64)
        if: matrix.arch == 'amd64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build CLI
        run: |
          CC=${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }} \
          GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -ldflags="-X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/synthgraph-linux-${{ matrix.arch }} ./cmd/synthgraph
      - name: Build Web App
        run: |
          CC=${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }} \
          GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -ldflags="-X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/synthgraph-web-linux-${{ matrix.arch }} ./cmd/synthgraph-web
      - uses: actions/upload-artifact@v4
        with:
          name: synthgraph-linux-${{ matrix.arch }}
          path: dist/synthgraph-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: synthgraph-web-linux-${{ matrix.arch }}
          path: dist/synthgraph-web-linux-${{ matrix.arch }}

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [test]
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install MinGW
        run: choco install mingw -y
        shell: pwsh
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $env:GITHUB_OUTPUT
        shell: pwsh
      - name: Build CLI
        run: go build -o dist/synthgraph-windows-${{ matrix.arch }}.exe ./cmd/synthgraph
        shell: pwsh
      - name: Build Web App
        run: go build -o dist/synthgraph-web-windows-${{ matrix.arch }}.exe ./cmd/synthgraph-web
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: synthgraph-windows-${{ matrix.arch }}
          path: dist/synthgraph-windows-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: synthgraph-web-windows-${{ matrix.arch }}
          path: dist/synthgraph-web-windows-${{ matrix.arch }}.exe

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [test]
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install C compiler
        run: |
          if ! command -v gcc &>/dev/null; then
            xcode-select --install 2>/dev/null || true
          fi
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build CLI
        run: |
          GOOS=darwin GOARCH=${{ matrix.arch }} \
          go build -o dist/synthgraph-darwin-${{ matrix.arch }} ./cmd/synthgraph
      - name: Build Web App
        run: |
          GOOS=darwin GOARCH=${{ matrix.arch }} \
          go build -o dist/synthgraph-web-darwin-${{ matrix.arch }} ./cmd/synthgraph-web
      - uses: actions/upload-artifact@v4
        with:
          name: synthgraph-darwin-${{ matrix.arch }}
          path: dist/synthgraph-darwin-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: synthgraph-web-darwin-${{ matrix.arch }}
          path: dist/synthgraph-web-darwin-${{ matrix.arch }}

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux-cli, build-windows, build-macos, build-docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: synthgraph-*
          merge-multiple: true
          path: dist
      - name: Checksum
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            **CLI:**
            - **Linux amd64** — `synthgraph-linux-amd64`
            - **Linux arm64** — `synthgraph-linux-arm64`
            - **macOS amd64 (Intel)** — `synthgraph-darwin-amd64`
            - **macOS arm64 (Apple Silicon)** — `synthgraph-darwin-arm64`
            - **Windows amd64** — `synthgraph-windows-amd64.exe`

            **Web App:**
            - **Linux amd64** — `synthgraph-web-linux-amd64`
            - **Linux arm64** — `synthgraph-web-linux-arm64`
            - **macOS amd64 (Intel)** — `synthgraph-web-darwin-amd64`
            - **macOS arm64 (Apple Silicon)** — `synthgraph-web-darwin-arm64`
            - **Windows amd64** — `synthgraph-web-windows-amd64.exe`

            **Docker:**
            - `ghcr.io/${{ github.repository }}:v...`
            - Build the `web` stage: `docker build --target web -t synthgraph-web .`

            **Checksums:** `checksums.txt`

            ### Install from source

            ```bash
            CGO_ENABLED=1 go install github.com/bella-247/SynthGraph/cmd/synthgraph@latest
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
